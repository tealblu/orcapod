name: Deploy to GitHub Releases
permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  deploy-to-github-releases:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Version from Project File
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -oE '<Version>[^<]+' orcapod/orcapod.csproj | sed 's/<Version>//' | head -n 1)
          COMMIT_DATE_UTC=$(date -u +%Y%m%d%H%M%S)
          # Only use base version for Velopack
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "timestamp=$COMMIT_DATE_UTC" >> $GITHUB_OUTPUT

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish Application
        run: dotnet publish orcapod/orcapod.csproj -c Release -o publish -r win-x64 --self-contained true

      - name: Create Velopack Release
        run: |
          dotnet tool install -g vpk
          vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -y
          vpk pack -u orcapod -v "${{ steps.get-version.outputs.version }}" --packDir publish -y
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --publish --releaseName "orcapod ${{ steps.get-version.outputs.version }}" --tag v${{ steps.get-version.outputs.version }}-${{ steps.get-version.outputs.timestamp }} --token ${{ secrets.GITHUB_TOKEN }} -y
